<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f7a5a">
<title>Basha Bari app (demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="app">
<div class="device">
  <div class="phone" id="phone">
    <div class="statusbar no-print"><span id="clock">9:41</span><span>●●●● 4G ▮</span></div>
    <div class="sms no-print" id="sms"></div>
    <main class="screen" id="screen" aria-live="polite"></main>
    <nav class="tabbar no-print" id="tabbar" hidden></nav>
    <div class="sheet-wrap no-print" id="sheet"></div>
    <div class="toast no-print" id="toast" role="status"></div>
  </div>
  <aside class="device-side no-print" id="side"></aside>
</div>
<script src="js/store.js"></script>
<script src="js/art.js"></script>
<script src="js/app.js"></script>
</body>
</html>
