<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basha Bari: demo v3</title>
<style>
:root{--bg:#f7f5f0;--surface:#fff;--ink:#1d1d1b;--muted:#6b6a64;--accent:#0f7a5a;--accent-ink:#fff;--line:#e4e1d8;--warn:#9a5b00;--ok:#1d6b3a;--mine:#e9f3ee}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141513;--surface:#1f201d;--ink:#f1efe8;--muted:#a3a197;--accent:#3cc596;--accent-ink:#0b1f17;--line:#333430;--warn:#e0a040;--ok:#6fd49a;--mine:#23302a}}
:root[data-theme="dark"]{--bg:#141513;--surface:#1f201d;--ink:#f1efe8;--muted:#a3a197;--accent:#3cc596;--accent-ink:#0b1f17;--line:#333430;--warn:#e0a040;--ok:#6fd49a;--mine:#23302a}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{font-weight:800;font-size:20px;color:var(--accent)}
main{max-width:940px;margin:0 auto;padding:18px}
h1{font-size:24px;margin:6px 0}
h2{font-size:17px;margin:14px 0 8px}
.muted{color:var(--muted);font-size:14px}
.notice{background:var(--surface);border:1px dashed var(--warn);color:var(--warn);padding:10px 12px;border-radius:10px;font-size:14px;margin:0 0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0;align-items:center}
input,select,textarea{font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-height:46px;flex:1 1 160px}
textarea{width:100%;min-height:80px}
.btn{font:inherit;font-weight:700;padding:12px 18px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{min-height:36px;padding:7px 12px;font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:520px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.photo{height:120px;display:grid;place-items:center;font-size:48px;background:var(--line)}
.body{padding:12px 14px}
.price{font-size:18px;font-weight:800}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.badge{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--ok);color:var(--ok)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.checks{list-style:none;padding:0;margin:10px 0}
.checks li{padding:8px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.item{padding:10px 0;border-top:1px solid var(--line)}
.hidden{display:none!important}
.err{color:var(--warn);font-size:14px;min-height:1.2em}
.ok{color:var(--ok);font-weight:700}
.msgs{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin:10px 0}
.msg{padding:8px 12px;border-radius:12px;max-width:80%;background:var(--line)}
.msg.me{align-self:flex-end;background:var(--mine)}
dialog{border:0;border-radius:16px;padding:0;width:min(540px,94vw);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dlg{padding:20px}
.fld{display:flex;flex-direction:column;gap:4px;flex:0 1 240px;max-width:100%;font-size:14px}
.fld>input,.fld>select,.fld>textarea{flex:none;width:100%}
.fld>span{font-weight:500}
.req{color:#c0392b;font-weight:700}
</style>
</head>
<body>
<header>
  <div class="logo" data-act="nav" data-v="landing" style="cursor:pointer">Basha Bari</div>
  <div id="top" class="row" style="margin:0;gap:8px"></div>
</header>
<main>
  <div class="notice" id="demo-note"></div>
  <div id="app"></div>
</main>
<datalist id="areas"><option>Mirpur</option><option>Uttara</option><option>Dhanmondi</option><option>Bashundhara R/A</option><option>Mohammadpur</option><option>Gulshan</option><option>Badda</option></datalist>
<dialog id="dlg"><div class="dlg" id="dlg-body"></div></dialog>

<script>
const T={

bn:{lang:'বাংলা',tagline:'ঝামেলা ছাড়াই ঢাকায় আপনার নতুন বাসা।',search:'এলাকা বা মহল্লা দিয়ে খুঁজুন',rentCta:'বাসা ভাড়া দিতে চান? এখানে পোস্ট করুন।',browse:'বাসা খুঁজুন',rentOut:'ভাড়া দিন',login:'লগ ইন',signup:'সাইন আপ',logout:'লগ আউট',
 area:'এলাকা',budget:'সর্বোচ্চ বাজেট',beds:'শয়নকক্ষ',any:'যেকোনো',call:'কল করুন',book:'দেখার সময় বুক করুন',chat:'চ্যাট',send:'পাঠান',cancel:'বাতিল',

 otp:'ফোনে পাঠানো ৪ সংখ্যার কোড দিন (ডেমো কোড: 1234)',verifyPhone:'ফোন যাচাই করুন',

 checkPhone:'ফোন যাচাইকৃত',checkId:'পরিচয় ও বয়স যাচাইকৃত',checkFace:'মুখ মিলেছে',
 needLogin:'আগে লগ ইন করুন।',needVerify:'এটি করতে যাচাই সম্পন্ন করুন।',
 rentTitle:'বাসা ভাড়া দিন',title:'তালিকার শিরোনাম',rentLbl:'মাসিক ভাড়া (৳)',bedrooms:'শয়নকক্ষ',desc:'সুবিধা, তলা, রাস্তা, যাতায়াত',
 postListing:'পর্যালোচনার জন্য জমা দিন',pending:'যাচাই অপেক্ষমাণ',approveDemo:'ডেমো: অনুমোদন',submitted:'জমা হয়েছে। পর্যালোচনার পর তালিকা প্রকাশ হবে।',
 myListings:'আপনার তালিকা',none:'কোনো বাসা মেলেনি। বাজেট বা এলাকা বদলান।',ownerPhone:'কল',
 bookTitle:'দেখার সময় বুক করুন',date:'তারিখ',time:'সময়',sent:'মালিকের কাছে অনুরোধ পাঠানো হয়েছে (ডেমো)।',
 chatTitle:'মালিকের সঙ্গে চ্যাট',typeMsg:'বার্তা লিখুন',demoReply:'বার্তার জন্য ধন্যবাদ। মালিক শীঘ্রই উত্তর দেবেন। (ডেমো)',
 verifiedBadge:'যাচাইকৃত',err18:'সঠিক জন্ম তারিখ দিন।'}
};
const t=k=>(T[S.lang]&&T[S.lang][k])||T.en[k]||k;
const CT={
en:{callBtn:`Call`,anytime:`Calls anytime`,busy:`Not taking calls today`,outside:`Calls not available now`,schedOn:`Set when people can call`,from:`From`,until:`Until`,busyOn:`I'm busy today`,busyOff:`Resume calls`,connecting:`Connecting through Basha Bari (demo). Neither number is shown to the other person.`,hangup:`End call`,closed:`This landlord cannot be called right now.`,ok:`OK`,privacy:`The call stays inside Basha Bari. The landlord's number stays private.`,dayNames:{Sat:`Sat`,Sun:`Sun`,Mon:`Mon`,Tue:`Tue`,Wed:`Wed`,Thu:`Thu`,Fri:`Fri`}},
bn:{callBtn:`কল করুন`,anytime:`যেকোনো সময় কল করা যাবে`,busy:`আজ কল নেওয়া হচ্ছে না`,outside:`এখন কল করা যাবে না`,schedOn:`কখন কল করা যাবে তা ঠিক করুন`,from:`শুরু`,until:`শেষ`,busyOn:`আজ ব্যস্ত আছি`,busyOff:`কল নেওয়া শুরু করুন`,connecting:`বাসাবাড়ি-এর মাধ্যমে সংযোগ হচ্ছে (ডেমো)। কোনো পক্ষের নম্বরই অন্যজনকে দেখানো হয় না।`,hangup:`কল শেষ করুন`,closed:`এই মালিককে এখন কল করা যাবে না।`,ok:`ঠিক আছে`,privacy:`কল বাসাবাড়ি-এর ভেতরে হয়। মালিকের নম্বর গোপন থাকে।`,dayNames:{Sat:`শনি`,Sun:`রবি`,Mon:`সোম`,Tue:`মঙ্গল`,Wed:`বুধ`,Thu:`বৃহ`,Fri:`শুক্র`}}
};
const ct=k=>(CT[S.lang]||CT.en)[k]||CT.en[k]||k;
const DAYS=['Sat','Sun','Mon','Tue','Wed','Thu','Fri'];
const dn=x=>(CT[S.lang]||CT.en).dayNames[x]||x;
const bd=s=>S.lang==='bn'?String(s).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]):String(s);
const callOf=l=>l.call||{enabled:false,from:'09:00',to:'18:00',days:[],busy:false};
function dhakaNow(){const p={};new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Dhaka',hour:'2-digit',minute:'2-digit',hour12:false,weekday:'short'}).formatToParts(new Date()).forEach(x=>p[x.type]=x.value);return {day:p.weekday,min:(Number(p.hour)%24)*60+Number(p.minute)};}
function callStatus(l){
  const c=callOf(l);
  if(c.busy) return {ok:false,text:ct('busy')};
  if(!c.enabled) return {ok:true,text:ct('anytime')};
  const now=dhakaNow();
  const m=s=>{const [h,mi]=s.split(':').map(Number);return h*60+mi;};
  const ok=c.days.includes(now.day)&&now.min>=m(c.from)&&now.min<m(c.to);
  const line=bd(c.from)+'–'+bd(c.to)+' · '+c.days.map(dn).join(', ');
  return {ok,text:ok?line:line+' · '+ct('outside')};
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>{const s=Number(n).toLocaleString('en-US');return S.lang==='bn'?s.replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]):s;};
const fmt=n=>'৳'+num(n);
const PH=/^01[3-9]\d{8}$/, NID=/^\d{10}(\d{3}|\d{7})?$/;

const seed=[
 {id:1,title:'2-bedroom flat',area:'Mirpur',rent:18000,beds:2,img:'🏢',phone:'01700000001',desc:'South-facing, 3rd floor, lift, generator backup.',live:true},
 {id:2,title:'Family flat',area:'Uttara',rent:28000,beds:3,img:'🏠',phone:'01700000002',desc:'Quiet road, parking space, water tank on roof.',live:true},
 {id:3,title:'Studio room',area:'Dhanmondi',rent:12000,beds:1,img:'🛏️',phone:'01700000003',desc:'Good for students, 5 minutes to the main road.',live:true},
 {id:4,title:'3-bedroom flat',area:'Bashundhara R/A',rent:35000,beds:3,img:'🏢',phone:'01700000004',desc:'Gated community, CCTV in common areas.',live:true},
 {id:5,title:'2-bedroom flat',area:'Mohammadpur',rent:16000,beds:2,img:'🏠',phone:'01700000005',desc:'Ground floor, near bus routes.',live:true}
];

const S={lang:'en',page:'landing',view:'list',mapSel:null,user:null,users:[],draft:null,ret:null,mine:[],
  filter:{area:'',max:'',beds:''},bookings:[],chats:{},chatId:null,dlgId:null};

function visibleListings(){
  return [...seed,...S.mine.filter(l=>l.live)].filter(l=>
    (!S.filter.area||l.area.toLowerCase().includes(S.filter.area.toLowerCase()))&&
    (!S.filter.max||l.rent<=Number(S.filter.max))&&
    (!S.filter.beds||l.beds>=Number(S.filter.beds)));
}

function cardHTML(l){
  const v=S.user&&S.user.verified;
  return `<article class="card"><div class="photo" data-act="detail" data-id="${l.id}" style="cursor:pointer">${l.img}</div><div class="body">
    <div class="price">${fmt(l.rent)}<span class="muted">/${S.lang==='bn'?'মাস':'month'}</span></div>
    <div>${esc(l.title)} · ${esc(l.area)}</div>
    <div class="muted">${num(l.beds)} ${t('beds').toLowerCase()}</div>
    <div class="muted">${esc(propLine(l))}</div>
    <div class="badges"><span class="badge">${t('verifiedBadge')}</span></div>
    <div class="actions">
      <div class="muted" style="width:100%">${esc(callStatus(l).text)}</div><button class="btn small ghost" data-act="gate" data-kind="call" data-id="${l.id}">${ct('callBtn')}</button>
      <button class="btn small" data-act="gate" data-kind="book" data-id="${l.id}">${t('book')}</button>
      <button class="btn small ghost" data-act="gate" data-kind="chat" data-id="${l.id}">${t('chat')}</button>
      <button class="btn small ghost" data-act="detail" data-id="${l.id}">${S.lang==='bn'?'বিস্তারিত':'Details'}</button>
    </div></div></article>`;
}

function browseHTML(){
  return `<h1>${t('browse')}</h1>
   <div class="panel" style="max-width:none;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span>${t('rentCta')}</span><button class="btn small" data-act="rent">${t('rentOut')}</button></div>
   <div class="row">
     <input id="f-area" list="areas" placeholder="${t('search')}" value="${esc(S.filter.area)}" aria-label="${t('area')}">
     <select id="f-max" aria-label="${t('budget')}">
       <option value="">${t('budget')}: ${t('any')}</option>
       <option value="15000" ${S.filter.max==='15000'?'selected':''}>≤ ${fmt(15000)}</option>
       <option value="25000" ${S.filter.max==='25000'?'selected':''}>≤ ${fmt(25000)}</option>
       <option value="40000" ${S.filter.max==='40000'?'selected':''}>≤ ${fmt(40000)}</option>
     </select>
     <select id="f-beds" aria-label="${t('beds')}">
       <option value="">${t('beds')}: ${t('any')}</option>
       ${[1,2,3].map(n=>`<option value="${n}" ${S.filter.beds==n?'selected':''}>${num(n)}+</option>`).join('')}
     </select>
   </div>
   <div id="grid" class="grid">${gridHTML()}</div>`;
}
function gridHTML(){
  const items=visibleListings();
  return items.map(cardHTML).join('')||`<p class="muted">${t('none')}</p>`;
}

function landingHTML(){
  const bn=S.lang==='bn';
  const cards=bn?[
    ['বিনামূল্যে','বাড়ি ভাড়া দেওয়া ও খোঁজা, দুটোই বিনামূল্যে।'],
    ['যাচাইকৃত মানুষ','ফোন, বয়স ও পরিচয় যাচাই ছাড়া কেউ যোগাযোগ বা বুকিং করতে পারে না।'],
    ['সঠিক সময়ে কল','মালিক নিজে ঠিক করেন কখন কল নেবেন।']
  ]:[
    ['Free to use','Listing a home and searching for one are both free.'],
    ['Verified people','Nobody can contact, book or list without phone, age and identity checks.'],
    ['Calls at the right time','Landlords choose when they take calls.']
  ];
  return `<section style="text-align:center;padding:48px 8px 36px">
    <div style="font-size:clamp(52px,13vw,104px);font-weight:800;color:var(--accent);line-height:1">${S.lang==='bn'?'বাসাবাড়ি':'Basha Bari'}</div>
    <p style="font-size:20px;margin:14px 0 28px">${t('tagline')}</p>
    <div class="row" style="justify-content:center;gap:14px">
      <button class="btn" style="min-width:230px;min-height:58px;font-size:18px" data-act="nav" data-v="browse">${bn?'বাসা খুঁজছি':'Looking for a house'}</button>
      <button class="btn ghost" style="min-width:230px;min-height:58px;font-size:18px" data-act="rent">${bn?'আমি বাসা ভাড়া দিতে চাই':'I want to rent out a house'}</button>
    </div>
    <p class="muted" style="margin-top:16px">${bn?'আমাদের সম্পর্কে জানতে নিচে স্ক্রল করুন ↓':'Scroll down to learn about us ↓'}</p>
  </section>

function topHTML(){
  const langBtn=`<button class="btn small ghost" data-act="lang" data-v="${S.lang==='bn'?'en':'bn'}">${S.lang==='bn'?'English':'বাংলা'}</button>`;
  const rent=`<button class="btn small" data-act="rent">${t('rentOut')}</button>`;
  const acct=S.user?`<button class="btn small ghost" data-act="logout">${t('logout')}</button>`
     :`<button class="btn small ghost" data-act="nav" data-v="login">${t('login')}</button>`;
  return langBtn+rent+acct;
}

function render(){
  const top=document.getElementById('top');
  document.querySelector('.logo').textContent=S.lang==='bn'?'বাসাবাড়ি':'Basha Bari';
  const app=document.getElementById('app');
  document.getElementById('demo-note').textContent=S.lang==='bn'
    ?'ডেমো। ব্যবহারকারী, তালিকা ও বার্তা সার্ভারে সংরক্ষিত হয় না।'
    :'Demo only. Accounts, listings and messages are not saved to a server.';
  if(!S.lang){
    top.innerHTML='';
    app.innerHTML=`<div class="panel"><h1>Basha Bari</h1><p class="muted">Choose your language / ভাষা বেছে নিন</p>
      <div class="row"><button class="btn" data-act="lang" data-v="en">English</button><button class="btn" data-act="lang" data-v="bn">বাংলা</button></div></div>`;
    return;
  }
  top.innerHTML=topHTML();
  let html='';
  if(S.page==='landing') html=landingHTML();
  else if(S.page==='browse') html=browseHTML();
  else if(S.page==='detail') html=detailHTML();
  else if(S.page==='login') html=authHTML('login');
  else if(S.page==='signup') html=authHTML('signup');
  else if(S.page==='verify') html=verifyHTML();
  else if(S.page==='rent') html=rentHTML();
  app.innerHTML=html;
  const b=document.getElementById('app');
  if(S.page==='browse'){
    /* grid already rendered */
  }
}

function go(page){S.page=page;render();}

function requireAccess(kind,id){
  if(!S.user){S.ret={kind,id};S.page='login';return render();}
  if(!S.user.verified){S.ret={kind,id};S.page='verify';return render();}
  if(kind==='rent'){S.page='rent';return render();}
  if(kind==='call') return openCall(id);
  if(kind==='book') return openBook(id);
  if(kind==='chat') return openChat(id);
}
function afterAuth(){
  if(S.user&&S.ret&&S.ret.kind==='detail'){const id=S.ret.id; S.ret=null; S.selId=id; S.page='detail'; return render();}
  S.ret=null;
  S.page=S.user&&S.user.verified?'browse':'verify';
  render();
}

function findListing(id){return seed.find(l=>l.id===id)||S.mine.find(l=>l.id===id);}
function openCall(id){
  const l=findListing(id); if(!l) return;
  const s=callStatus(l);
  const body=document.getElementById('dlg-body');
  if(!s.ok){
    body.innerHTML=`<h2>${esc(l.title)}</h2><p>${ct('closed')}</p><p class="muted">${esc(s.text)}</p><button class="btn" data-act="close">${ct('ok')}</button>`;
  } else {
    body.innerHTML=`<h2>${ct('callBtn')} · ${esc(l.title)}</h2><p>${ct('connecting')}</p><p class="muted">${ct('privacy')}</p><button class="btn" data-act="close">${ct('hangup')}</button>`;
  }
  document.getElementById('dlg').showModal();
}

function openBook(id){
  const l=findListing(id); if(!l) return;
  S.dlgId=id;
  document.getElementById('dlg-body').innerHTML=`<h2>${t('bookTitle')}: ${esc(l.title)} · ${esc(l.area)}</h2>
   <form data-form="book">
     <div class="row"><input name="date" type="date" required><select name="time">
       <option>10:00 AM</option><option>12:00 PM</option><option>3:00 PM</option><option>5:00 PM</option></select></div>
     <div class="err" id="err"></div>
     <div class="row"><button class="btn" type="submit">${t('send')}</button><button class="btn ghost" type="button" data-act="close">${t('cancel')}</button></div>
   </form>`;
  document.getElementById('dlg').showModal();
}

function renderChat(id){
  const l=findListing(id);
  const msgs=(S.chats[id]||[]).map(m=>`<div class="msg ${m.me?'me':''}">${esc(m.text)}</div>`).join('');
  document.getElementById('dlg-body').innerHTML=`<h2>${t('chatTitle')}</h2><div class="muted">${esc(l.title)} · ${esc(l.area)}</div>
   <div class="msgs" id="msgs">${msgs}</div>
   <form data-form="chat" class="row"><input name="text" placeholder="${t('typeMsg')}" autocomplete="off" required><button class="btn small" type="submit">${t('send')}</button><button class="btn small ghost" type="button" data-act="close">${t('cancel')}</button></form>`;
}
function openChat(id){S.chatId=id;renderChat(id);document.getElementById('dlg').showModal();}

function setErr(msg){const e=document.getElementById('err'); if(e) e.textContent=msg||'';}

document.addEventListener('click',e=>{
  if(mapClick(e)) return;
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act;
  if(a==='close'){document.getElementById('dlg').close();return;}
  if(a==='lang'){S.lang=el.dataset.v;return render();}
  if(a==='nav'){S.page=el.dataset.v;return render();}
  if(a==='rent'){return requireAccess('rent');}
  if(a==='logout'){S.user=null;S.ret=null;S.page='browse';return render();}
  if(a==='gate'){return requireAccess(el.dataset.kind,Number(el.dataset.id));}
  if(a==='face'){if(S.user){S.user.faceOK=true;} return render();}
  if(a==='busy'){const l=S.mine.find(x=>x.id===Number(el.dataset.id)); if(l){const c=callOf(l); c.busy=!c.busy; l.call=c;} return render();}
  if(a==='phototog'){S.lf.open=!S.lf.open; document.getElementById('photos').innerHTML=photosHTML(); return;}
  if(a==='detail'){S.selId=Number(el.dataset.id); S.page='detail'; return render();}
  if(a==='detailauth'){S.ret={kind:'detail',id:S.selId}; S.page=el.dataset.v; return render();}
  if(mapAct(a,el)) return;
  if(a==='approve'){const l=S.mine.find(x=>x.id===Number(el.dataset.id)); if(l){l.live=true;} return render();}
});

document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]'); if(!f) return;
  e.preventDefault();
  const fd=new FormData(f), k=f.dataset.form;

  if(k==='signup'){
    const dob=new Date(fd.get('dob'));
    if(isNaN(dob)) return setErr(t('err18'));
    const age=(Date.now()-dob)/(365.25*24*3600*1000);
    if(age<18) return setErr(t('under18'));
    if(!PH.test(fd.get('phone'))) return setErr('01XXXXXXXXX');
    if(S.users.some(u=>u.phone===fd.get('phone'))) return setErr(t('phoneTaken'));
    const u={name:fd.get('name'),phone:fd.get('phone'),pass:fd.get('pass'),phoneOK:false,idOK:false,faceOK:false,verified:false};
    S.users.push(u); S.user=u; S.page='verify'; return render();
  }
  if(k==='login'){
    const u=S.users.find(x=>x.phone===fd.get('phone')&&x.pass===fd.get('pass'));
    if(!u) return setErr(t('badLogin'));
    S.user=u; return afterAuth();
  }
  if(k==='otp'){
    if(fd.get('code')!=='1234') return setErr('1234');
    S.user.phoneOK=true; return render();
  }
  if(k==='nid'){
    if(!NID.test(fd.get('nid'))) return setErr('10, 13 or 17 digits');
    S.user.nidOK=true; return render();
  }
  if(k==='idcheck'){
    if(!S.user.faceOK) return setErr(t('face'));
    S.user.idOK=true; S.user.verified=true; return afterAuth();
  }
  if(k==='listing'){
    const L=S.lf;
    if(!L.pin) return setErr(ft('errLoc'));
    if(L.isOwner===''){return setErr(ft('errChoose'));}
    if(L.isOwner==='no'&&L.relation==='') return setErr(ft('errRelation'));
    if(L.service===''||L.water===''||L.gas===''||L.gasType==='') return setErr(ft('errChoose'));
    if(L.service==='yes'&&((L.water==='included'&&L.waterWhere==='')||(L.gas==='included'&&L.gasWhere===''))) return setErr(ft('errWhere'));
    const mode=fd.get('callMode');
    if(!mode) return setErr(ft('errChoose'));
    const days=fd.getAll('day');
    if(mode==='hours'&&!days.length) return setErr(ft('errDays'));
    const missing=photoSlots(L).filter(x=>!L.photos[x.key]);
    if(missing.length) return setErr(ft('errPhotos')+': '+missing.map(x=>x.label).join(', '));
    const rent=Number(fd.get('rent'));
    if(rent<1000) return setErr(ft('errRent'));
    const withService=L.service==='yes';
    S.mine.push({id:Date.now(),title:fd.get('title'),area:fd.get('area'),address:fd.get('address'),rent,desc:fd.get('desc'),
      type:L.type,ownership:{yes:L.isOwner==='yes',relation:L.isOwner==='no'?L.relation:''},pin:L.pin,beds:L.beds,baths:L.baths,balconies:L.balconies,photoCount:Object.keys(L.photos).length,
      service:{on:withService,amount:Number(fd.get('serviceAmt'))||0,benefit:fd.get('serviceBenefit')||''},
      water:{mode:L.water,where:withService?L.waterWhere:'rent'},
      gas:{mode:L.gas,type:L.gasType,where:withService?L.gasWhere:'rent'},
      img:L.type==='house'?'🏠':'🏢',phone:S.user.phone,owner:S.user.name,live:false,
      call:{enabled:mode==='hours',from:fd.get('from')||'09:00',to:fd.get('to')||'18:00',days:mode==='hours'?days:[],busy:false}});
    S.lf=lfDefault(); return render();
  }
  if(k==='book'){
    const id=S.dlgId, l=findListing(id);
    if(!fd.get('date')) return setErr(t('date'));
    S.bookings.push({listing:l.title,date:fd.get('date'),time:fd.get('time')});
    document.getElementById('dlg-body').innerHTML=`<h2 class="ok">${t('sent')}</h2><p>${esc(fd.get('date'))} · ${esc(fd.get('time'))}</p><button class="btn" data-act="close">OK</button>`;
    return;
  }
  if(k==='chat'){
    const id=S.chatId;
    (S.chats[id]=S.chats[id]||[]).push({me:true,text:fd.get('text')});
    renderChat(id);
    setTimeout(()=>{
      if(S.chatId!==id||!document.getElementById('dlg').open) return;
      S.chats[id].push({me:false,text:t('demoReply')}); renderChat(id);
    },700);
  }
});

const AREAS={'Mirpur':[250,250],'Uttara':[300,90],'Dhanmondi':[420,430],'Bashundhara R/A':[640,260],'Mohammadpur':[330,440],'Gulshan':[600,420],'Badda':[700,520]};
const MVS={}, MO={}; let DRAG=false;
function areaOf(name){return AREAS[name]||[500,400];}
function snap(p){return {x:Math.round(p.x/40)*40+20,y:Math.round(p.y/40)*40+20};}
function pubPos(l){ if(l.pin) return snap(l.pin); const c=areaOf(l.area); return snap({x:c[0]+((l.id*37)%60)-30,y:c[1]+((l.id*53)%60)-30}); }
function nearArea(p){let best='',bestD=1e12;for(const k in AREAS){const c=AREAS[k];const d=(c[0]-p.x)**2+(c[1]-p.y)**2;if(d<bestD){bestD=d;best=k;}}return best;}
function pinText(p){return ft('pinNear')+': '+nearArea(p);}
function mapSVG(o){
  const id=o.id, markers=o.markers||[], pin=o.pin||null, pick=o.pick||null, h=o.h||340;
  const m=MVS[id]||{z:1,tx:0,ty:0};
  const areas=Object.keys(AREAS).map(k=>`<circle cx="${AREAS[k][0]}" cy="${AREAS[k][1]}" r="80" fill="#fff" fill-opacity=".35"/><text x="${AREAS[k][0]}" y="${AREAS[k][1]+115}" text-anchor="middle" font-size="34" fill="#5a5a52">${k}</text>`).join('');
  const mk=markers.map(x=>`<g data-mark="${x.id}" data-map="${id}" style="cursor:pointer"><rect x="${x.x-50}" y="${x.y-26}" width="100" height="50" rx="14" fill="#0f7a5a"/><text x="${x.x}" y="${x.y+8}" text-anchor="middle" font-size="28" fill="#fff" font-weight="700">${x.label}</text></g>`).join('');
  const pn=pin?`<circle cx="${pin.x}" cy="${pin.y}" r="22" fill="#c0392b" stroke="#fff" stroke-width="6"/>`:'';
  return `<div id="mp-${id}" class="mapbox" data-map="${id}"${pick?` data-pick="${pick}"`:''} style="position:relative;height:${h}px;overflow:hidden;border:1px solid var(--line);border-radius:12px;touch-action:none;cursor:${pick?'crosshair':'grab'}">
    <svg viewBox="0 0 1000 800" preserveAspectRatio="none" width="100%" height="100%" style="display:block">
      <rect width="1000" height="800" fill="#e4ecdf"/>
      <g class="mv" transform="translate(${m.tx} ${m.ty}) scale(${m.z})">
        <path d="M-100 560 C200 520 300 620 500 600 S800 540 1100 610" stroke="#a9cdea" stroke-width="44" fill="none"/>
        ${areas}${mk}${pn}
      </g></svg>
    <div style="position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px;z-index:2">
      <button type="button" class="btn small" data-act="zoom" data-map="${id}" data-f="1.4">+</button>
      <button type="button" class="btn small" data-act="zoom" data-map="${id}" data-f="0.7">−</button>
      <button type="button" class="btn small ghost" data-act="zoom" data-map="${id}" data-f="reset">⟲</button>
    </div></div>`;
}
function redrawMap(id,o){MO[id]=o; const el=document.getElementById('mp-'+id); if(el) el.outerHTML=mapSVG(o);}
function previewHTML(l){
  if(!l) return '';
  return `<div class="card" style="max-width:360px"><div class="photo" style="height:90px;font-size:36px">${l.img}</div><div class="body">
    <div class="price">${fmt(l.rent)}<span class="muted">/${dl('month','মাস')}</span></div>
    <div>${esc(l.title)} · ${esc(l.area)}</div>
    <div class="actions"><button class="btn small" data-act="detail" data-id="${l.id}">${ft('openListing')}</button></div></div></div>`;
}
function browseMapHTML(){
  const markers=visibleListings().map(l=>{const p=pubPos(l);return {id:l.id,x:p.x,y:p.y,label:bd(Math.round(l.rent/1000))+'k'};});
  MO.browse={id:'browse',markers,h:440};
  return mapSVG(MO.browse)+`<div id="prev-browse" style="margin-top:12px">${S.mapSel?previewHTML(findListing(S.mapSel)):''}</div>`;
}
function refreshMap(){const w=document.getElementById('mapwrap'); if(w) w.innerHTML=browseMapHTML();}
function pickerHTML(){
  const L=S.lf; MO.lf={id:'lf',markers:[],pin:L.pin,pick:'lf',h:300};
  return mapSVG(MO.lf)+`<p id="pinlabel" class="muted">${L.pin?pinText(L.pin):ft('tapMap')}</p>`;
}
function mapAct(a,el){
  if(a==='view'){S.view=el.dataset.v; render(); return true;}
  if(a==='zoom'){
    const id=el.dataset.map, m=MVS[id]||{z:1,tx:0,ty:0}, f=el.dataset.f;
    if(f==='reset'){MVS[id]={z:1,tx:0,ty:0};}
    else{const z=Math.min(6,Math.max(1,m.z*Number(f))), k=z/m.z; MVS[id]={z,tx:500-(500-m.tx)*k,ty:400-(400-m.ty)*k};}
    redrawMap(id,MO[id]); return true;
  }
  if(a==='viewmap'){
    const l=findListing(Number(el.dataset.id)), p=pubPos(l);
    MO.dlgmap={id:'dlgmap',markers:[{id:l.id,x:p.x,y:p.y,label:bd(Math.round(l.rent/1000))+'k'}],h:360};
    MVS.dlgmap={z:2,tx:500-p.x*2,ty:400-p.y*2};
    document.getElementById('dlg-body').innerHTML=`<h2>${ft('location')}</h2><p class="muted">${ft('approxLoc')}: ${esc(l.area)}</p>${mapSVG(MO.dlgmap)}<div class="row"><button class="btn ghost" data-act="close">${dl('Close','বন্ধ করুন')}</button></div>`;
    document.getElementById('dlg').showModal(); return true;
  }
  if(a==='editloc'){
    const l=findListing(Number(el.dataset.id)); S.editId=l.id;
    S.editPin=l.pin||{x:areaOf(l.area)[0],y:areaOf(l.area)[1]};
    MO.edit={id:'edit',markers:[],pin:S.editPin,pick:'edit',h:320}; MVS.edit={z:1,tx:0,ty:0};
    document.getElementById('dlg-body').innerHTML=`<h2>${ft('changeLoc')}</h2>${mapSVG(MO.edit)}<p id="pinlabel2" class="muted">${pinText(S.editPin)}</p><div class="row"><button class="btn" data-act="saveloc">${ft('saveLoc')}</button><button class="btn ghost" data-act="close">${dl('Close','বন্ধ করুন')}</button></div>`;
    document.getElementById('dlg').showModal(); return true;
  }
  if(a==='saveloc'){const l=S.mine.find(x=>x.id===S.editId); if(l) l.pin=S.editPin; document.getElementById('dlg').close(); render(); return true;}
  return false;
}
function mapClick(e){
  if(e.target.closest&&e.target.closest('[data-act]')) return false;
  if(DRAG) return true;
  const mk=e.target.closest&&e.target.closest('[data-mark]');
  if(mk){S.mapSel=Number(mk.dataset.mark); const p=document.getElementById('prev-'+mk.dataset.map); if(p) p.innerHTML=previewHTML(findListing(S.mapSel)); return true;}
  const pk=e.target.closest&&e.target.closest('[data-pick]');
  if(pk){
    const id=pk.dataset.map, r=pk.querySelector('svg').getBoundingClientRect(), m=MVS[id]||{z:1,tx:0,ty:0};
    const pt={x:Math.round(((e.clientX-r.left)*1000/r.width-m.tx)/m.z), y:Math.round(((e.clientY-r.top)*800/r.height-m.ty)/m.z)};
    if(id==='lf'){S.lf.pin=pt; redrawMap('lf',{...MO.lf,pin:pt}); const lb=document.getElementById('pinlabel'); if(lb) lb.textContent=pinText(pt);}
    if(id==='edit'){S.editPin=pt; redrawMap('edit',{...MO.edit,pin:pt}); const lb=document.getElementById('pinlabel2'); if(lb) lb.textContent=pinText(pt);}
    return true;
  }
  return false;
}
document.addEventListener('pointerdown',()=>{DRAG=false;});
document.addEventListener('pointermove',e=>{
  if(!(e.buttons&1)) return;
  if(Math.abs(e.movementX)+Math.abs(e.movementY)<3) return;
  const c=e.target.closest&&e.target.closest('.mapbox'); if(!c) return;
  DRAG=true; const id=c.dataset.map, r=c.querySelector('svg').getBoundingClientRect();
  const m=MVS[id]||{z:1,tx:0,ty:0};
  m.tx+=e.movementX*1000/r.width; m.ty+=e.movementY*800/r.height; MVS[id]=m;
  const g=c.querySelector('g.mv'); if(g) g.setAttribute('transform',`translate(${m.tx} ${m.ty}) scale(${m.z})`);
});
document.addEventListener('input',e=>{
  if(e.target.id!=='loc-search') return;
  const q=e.target.value.trim().toLowerCase(); if(q.length<2||!MO.lf) return;
  const k=Object.keys(AREAS).find(a=>a.toLowerCase().includes(q)); if(!k) return;
  const pt={x:AREAS[k][0],y:AREAS[k][1]}; S.lf.pin=pt;
  MVS.lf={z:2,tx:500-pt.x*2,ty:400-pt.y*2};
  redrawMap('lf',{...MO.lf,pin:pt});
  const lb=document.getElementById('pinlabel'); if(lb) lb.textContent=pinText(pt);
});
render();
</script>
</body>
</html>
